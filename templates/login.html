<!DOCTYPE html>
<html>
<head>
    <title>Login - AI Placement Assistant</title>

    <style>
        body{
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:15px;
            width:320px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
            text-align:center;
        }

        h2{
            margin-bottom:20px;
            color:#333;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:95%;
            padding:10px;
            background:#667eea;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#5a67d8;
        }

        a{
            display:block;
            margin-top:15px;
            text-decoration:none;
            color:#667eea;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Login 🚀</h2>

        <form method="POST">

            <input type="email" name="email" placeholder="Enter Email" required>
            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>

        </form>

        <a href="/signup">Don't have an account? Signup</a>

    </div>

</body>
</html>
