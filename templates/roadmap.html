<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Career Roadmap | AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Markdown rendering ke liye simple script -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<nav><div class="logo">AI Placement Assistant</div><div><a href="/dashboard">Home</a><a href="/ai">AI Interview</a><a href="/roadmap">Roadmap</a><a href="/logout">Logout</a></div></nav>
<div class="container">
    <h1>🎯 AI Career Roadmap</h1>
    <div class="card">
        <form method="POST">
            <label>Enter Target Role (e.g. Data Scientist, DevOps )</label>
            <input type="text" name="role" placeholder="e.g. Full Stack Developer" required>
            <button type="submit">✨ Generate Roadmap</button>
        </form>
    </div>
    {% if roadmap %}
    <div class="card">
        <h2 style="color: #38bdf8;">Roadmap for {{ role.title() }}</h2>
        <div id="roadmap-content"></div>
        <script>document.getElementById('roadmap-content').innerHTML = marked.parse({{ roadmap|tojson }});</script>
    </div>
    {% endif %}
</div>
</body>
</html>
