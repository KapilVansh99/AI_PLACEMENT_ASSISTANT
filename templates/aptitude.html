<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>AI Aptitude Test</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<nav><div class="logo">AI Placement Assistant</div><div><a href="/dashboard">Home</a><a href="/aptitude">Aptitude</a><a href="/logout">Logout</a></div></nav>
<div class="container">
    <h1>🧠 AI Aptitude Test</h1>
    <div class="card">
        <form method="POST">
            <label>Topic (e.g. Quantitative, Logical, Verbal )</label>
            <input type="text" name="topic" placeholder="e.g. Profit and Loss" required>
            <button type="submit">✨ Generate Test</button>
        </form>
    </div>
    {% if questions_text %}
    <div class="card">
        <div id="quiz-content"></div>
        <script>document.getElementById('quiz-content').innerHTML = marked.parse({{ questions_text|tojson }});</script>
    </div>
    {% endif %}
</div>
</body>
</html>
